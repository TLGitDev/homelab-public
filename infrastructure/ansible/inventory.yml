# Les machines auxquelles Ansible parle.
# ansible_host est l'adresse réelle. Le nom (localhost, runner-essai) est celui
# qu'utilisent les playbooks dans hosts:.

all:
  hosts:
    # Le PC. C'est lui qui appelle l'API de Proxmox.
    # L'interpréteur est celui du venv WSL, là où proxmoxer est installé.
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /opt/ansible-venv/bin/python3
    # Le CT 108, joint par pct en SSH vers pve. Pas le 107.
    runner-essai:
      ansible_host: <ip-pve>
      ansible_user: root
      ansible_connection: community.proxmox.proxmox_pct_remote
      proxmox_vmid: 108
    # Le CT 109, même chemin. Pas le 106.
    navidrome-essai:
      ansible_host: <ip-pve>
      ansible_user: root
      ansible_connection: community.proxmox.proxmox_pct_remote
      proxmox_vmid: 109
