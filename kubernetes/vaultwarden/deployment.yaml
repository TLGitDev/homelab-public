apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.3
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: DOMAIN
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: DATABASE_URL
            - name: SIGNUPS_ALLOWED
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: SIGNUPS_ALLOWED
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: ADMIN_TOKEN
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-zfs-pvc
