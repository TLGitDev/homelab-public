# Chiffres du CT d'essai. Le CT en service est le 105, <ip-servarr>.
# Cet essai est le 112, <ip-servarr-ct112>. Relancer le playbook recrée le 112.
# Les versions sont celles lues le 8 nov. dans le journal du 105.
# Bazarr n'avait pas de ligne Version : on reprend le 1.6.2 du 29 oct.
# Les empreintes sont celles publiées par GitHub pour ces archives.
# Celle de Lidarr est aussi celle écrite dans Mediatheques.md.
# Celle de Prowlarr a en plus été recalculée sur le fichier téléchargé.
# L'adresse /releases/download répond 504 depuis ici. L'adresse d'API
# ci-dessous est le même fichier : elle redirige vers l'archive, et
# l'empreinte est revérifiée après le téléchargement.

servarr_vmid: 112
servarr_hostname: servarr-essai
servarr_address: <ip-servarr-ct112>/24
servarr_gateway: <ip-box>
servarr_nameserver: <ip-box>
servarr_cores: 2
servarr_memory: 4096
servarr_swap: 512
servarr_disk: local-zfs:16
servarr_ostemplate: local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst
servarr_node: pve
proxmox_api_host: <ip-pve>
servarr_media_gid: 1000

# Comptes lus sur le 105. media seulement pour ceux qui écrivent dans la médiathèque.
# Prowlarr et Recyclarr restent hors de media.
servarr_accounts:
  - { name: prowlarr, uid: 102, gid: 105, media: false }
  - { name: sonarr, uid: 103, gid: 106, media: true }
  - { name: radarr, uid: 104, gid: 107, media: true }
  - { name: bazarr, uid: 105, gid: 108, media: true }
  - { name: recyclarr, uid: 106, gid: 109, media: false }
  - { name: lidarr, uid: 107, gid: 110, media: true }

servarr_archives:
