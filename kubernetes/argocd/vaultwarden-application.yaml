apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:TLGitDev/homelab.git
    targetRevision: HEAD
    path: kubernetes/vaultwarden

  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
