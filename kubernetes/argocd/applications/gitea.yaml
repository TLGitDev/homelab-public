apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:TLGitDev/homelab.git
    targetRevision: HEAD
    path: kubernetes/gitea

  destination:
    server: https://kubernetes.default.svc
    namespace: gitea

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
