# Lit kubernetes/ et le confronte au schéma Kubernetes 1.36.4,
# la version de k3s-01 relevée le 6 nov. 2026. Ne déploie rien.
# Application, SealedSecret et IngressRoute ne sont pas dans ce schéma.

name: Manifestes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    name: Schéma Kubernetes 1.36.4
    runs-on: ubuntu-latest
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4

      - name: Installer kubeconform v0.8.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Contrôler kubernetes/
        shell: bash
        run: |
          set -euo pipefail
          kubeconform \
            -kubernetes-version 1.36.4 \
            -strict \
            -summary \
            -skip Application,SealedSecret,IngressRoute \
            kubernetes
