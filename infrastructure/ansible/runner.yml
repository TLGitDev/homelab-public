# Crée le CT 108 et y pose le runner. Ne touche pas au CT 107.
# L'enregistrement est une tâche à part : ansible-playbook runner.yml --tags register
# Les jetons sont dans secrets.yml, ignoré par Git.

- name: Créer le CT d'essai
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/runner.yml
    - secrets.yml
  roles:
    - lxc_runner

- name: Poser le runner dans le CT
  hosts: runner-essai
  gather_facts: false
  vars_files:
    - vars/runner.yml
  roles:
    - gitea_runner

- name: Enregistrer le runner
  hosts: runner-essai
  gather_facts: false
  tags: [register, never]
  vars_files:
    - vars/runner.yml
    - secrets.yml
  tasks:
    - name: Enregistrer
      ansible.builtin.import_role:
        name: gitea_runner
        tasks_from: register
