# Réglages d'Ansible pour ce dossier.
# Les chemins ci-dessous sont relatifs à ce fichier.
# Lancer depuis infrastructure/ansible, par exemple :
#   ansible-playbook playbooks/runner.yml
#   ansible-playbook playbooks/navidrome.yml

[defaults]
# Qui contacter. localhost est le PC. Le détail est dans inventory.yml.
inventory = inventory.yml
# Dossier des rôles (roles/lxc_runner, roles/navidrome, ...).
roles_path = roles
# Pas de vache dessinée dans la sortie.
nocows = true
# Pas de fichier .retry quand une tâche échoue.
retry_files_enabled = false
# Vérifier la clé SSH de pve avant de s'y connecter.
host_key_checking = True
