<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12100e">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Labo</title>
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      --bg: #12100e;
      --card: #1c1916;
      --line: rgba(244, 239, 230, 0.12);
      --text: #f4efe6;
      --muted: #a89b8c;
      --sun: #e7b15a;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(231, 177, 90, 0.16), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(980px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.4rem 0 3rem;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }

    .mark {
      width: 46px;
      height: 46px;
      flex: none;
    }

    h1 {
      margin: 0;
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    section { margin-top: 1.7rem; }

    h2 {
      margin: 0 0 0.75rem;
      color: var(--sun);
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 16.5rem);
      min-height: 8.2rem;
      padding: 1rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: inherit;
      text-align: center;
      text-decoration: none;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: rgba(231, 177, 90, 0.7);
      outline: none;
    }

    .icon {
      width: 30px;
      height: 30px;
      margin-bottom: 0.55rem;
      color: var(--sun);
    }

    a.card strong {
      font-size: 1.05rem;
      font-weight: 650;
    }

    a.card span {
      margin-top: 0.12rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

  </style>
</head>
<body>
  <main>
    <header>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#1c1916" stroke="#e7b15a" stroke-width="2"/>
        <circle cx="32" cy="32" r="10" fill="#e7b15a"/>
        <path d="M32 8v8M32 48v8M8 32h8M48 32h8M14.5 14.5l5.6 5.6M43.9 43.9l5.6 5.6M14.5 49.5l5.6-5.6M43.9 20.1l5.6-5.6" stroke="#c4843a" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Labo</h1>
    </header>

    <section>
      <h2>Administration</h2>
      <div class="grid">
        <a class="card" rel="noopener" href="https://<ip-pve>:8006">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="6" rx="1.5"/>
            <rect x="3" y="14" width="18" height="6" rx="1.5"/>
            <path d="M7 7h.01M7 17h.01"/>
          </svg>
          <strong>Proxmox</strong>
          <span>Machines</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-k3s-01>:3000">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.2"/>
            <circle cx="6" cy="18" r="2.2"/>
            <circle cx="18" cy="12" r="2.2"/>
            <path d="M8 7.2 16 11M8 16.8 16 13"/>
          </svg>
          <strong>Gitea</strong>
          <span>Forge</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Applications</h2>
      <div class="grid">
        <a class="card" rel="noopener" href="https://vaultwarden.labo.example">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="1.6"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
          <strong>Vaultwarden</strong>
          <span>Coffre</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-k3s-01>/">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12a8 8 0 0 1-13.7 5.6"/>
            <path d="M4 12a8 8 0 0 1 13.7-5.6"/>
            <path d="M16 4.5h2.5V7"/>
            <path d="M8 19.5H5.5V17"/>
          </svg>
          <strong>Argo CD</strong>
          <span>Cluster</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Image et son</h2>
      <div class="grid">
        <a class="card" rel="noopener" href="http://<ip-jellyfin>:8096">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m10 9 6 3-6 3z"/>
          </svg>
          <strong>Jellyfin</strong>
          <span>Films et séries</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-navidrome>:4533">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V6l10-2v12"/>
            <circle cx="7" cy="18" r="2.2"/>
            <circle cx="17" cy="16" r="2.2"/>
          </svg>
          <strong>Navidrome</strong>
          <span>Musique</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Collection</h2>
      <div class="grid">
        <a class="card" rel="noopener" href="http://<ip-qbittorrent>:8080">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v11"/>
            <path d="m8 11 4 4 4-4"/>
            <path d="M5 19h14"/>
          </svg>
          <strong>qBittorrent</strong>
          <span>Téléchargements</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-servarr>:9696">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <strong>Prowlarr</strong>
          <span>Indexeurs</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-servarr>:8989">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <path d="M8 21h8"/>
          </svg>
          <strong>Sonarr</strong>
          <span>Séries</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-servarr>:7878">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/>
          </svg>
          <strong>Radarr</strong>
          <span>Films</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-servarr>:8686">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"/>
            <circle cx="12" cy="12" r="2.2"/>
          </svg>
          <strong>Lidarr</strong>
          <span>Disques</span>
        </a>
        <a class="card" rel="noopener" href="http://<ip-servarr>:6767">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <path d="M8 10.5h.01M8 13.5h.01M11 12h5"/>
          </svg>
          <strong>Bazarr</strong>
          <span>Sous-titres</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
