#!/usr/sbin/nft -f
flush ruleset
table inet torrent {
  chain dns {
    type nat hook output priority dstnat; policy accept;
    meta skuid qbittorrent meta nfproto ipv4 udp dport 53 ip daddr != 10.2.0.1 dnat ip to 10.2.0.1
    meta skuid qbittorrent meta nfproto ipv4 tcp dport 53 ip daddr != 10.2.0.1 dnat ip to 10.2.0.1
  }
  chain output {
    type filter hook output priority filter; policy accept;
    meta skuid != qbittorrent accept
    oifname "lo" accept
    oifname "wg0" accept
    ip daddr <réseau-lan> tcp dport 53 reject
    ip daddr <réseau-lan> udp dport 53 reject
    ip daddr <réseau-lan> accept
    meta mark 51820 accept
    reject
  }
}
