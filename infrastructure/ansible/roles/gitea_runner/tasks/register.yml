- name: Enregistrer le runner auprès de la forge
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gitea-runner
      - --config
      - /etc/gitea-runner/config.yaml
      - register
      - --no-interactive
      - --instance
      - "{{ gitea_instance_url }}"
      - --name
      - "{{ gitea_runner_name }}"
      - --labels
      - "{{ gitea_runner_labels }}"
  args:
    chdir: /var/lib/gitea-runner
    creates: /var/lib/gitea-runner/.runner
  environment:
    GITEA_RUNNER_REGISTRATION_TOKEN: "{{ gitea_runner_registration_token }}"
  no_log: true

- name: Protéger le fichier d'enregistrement
  ansible.builtin.file:
    path: "{{ item }}"
    owner: gitea-runner
    group: gitea-runner
    mode: "0600"
  loop:
    - /var/lib/gitea-runner/.runner
    - /var/lib/gitea-runner/.runner.lock

- name: Démarrer le service
  ansible.builtin.systemd:
    name: gitea-runner
    enabled: true
    state: started
    daemon_reload: true
