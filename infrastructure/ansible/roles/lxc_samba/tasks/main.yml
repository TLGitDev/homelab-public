# Crée le CT 111. Refuse les CT déjà pris, dont le 102 (Samba en service).
# Le 102 monte tank en écriture. Ici chaque montage porte ro=1 : on vérifie
# les cinq lignes avant de démarrer. Proxmox refuse un bind mount à un jeton
# d'API : pct le pose en SSH, en root sur pve. L'idmap envoie le compte utilisateur
# du CT vers utilisateur et perso de pve, comme sur le 102. Pas de fichier de pare-feu :
# le 102 n'en a pas.

- name: Refuser les CT déjà pris
  ansible.builtin.fail:
    msg: Ce playbook ne touche pas aux CT 100 à 110.
  when: samba_vmid | int in [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110]

- name: Voir si le CT d'essai existe déjà
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - root@{{ proxmox_api_host }}
      - pct
      - config
      - "{{ samba_vmid }}"
  register: ct_existant
  changed_when: false
  failed_when: false

- name: Refuser un CT qui n'est pas l'essai
  ansible.builtin.fail:
    msg: Le CT {{ samba_vmid }} existe et ce n'est pas {{ samba_hostname }}.
  when:
    - ct_existant.rc == 0
    - samba_hostname not in ct_existant.stdout

- name: Créer le CT d'essai
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: root@pam
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: false
    node: "{{ samba_node }}"
    vmid: "{{ samba_vmid }}"
    hostname: "{{ samba_hostname }}"
    ostemplate: "{{ samba_ostemplate }}"
    ostype: debian
    password: "{{ runner_root_password }}"
    unprivileged: true
    onboot: true
    cores: "{{ samba_cores }}"
    memory: "{{ samba_memory }}"
    swap: "{{ samba_swap }}"
    disk: "{{ samba_disk }}"
    nameserver: "{{ samba_nameserver }}"
    features:
      - nesting=1
    netif:
      net0: "name=eth0,bridge=vmbr0,firewall=1,gw={{ samba_gateway }},ip={{ samba_address }},type=veth"
    update: false
    state: present
  no_log: true

- name: Monter tank en lecture seule
  ansible.builtin.shell: |
    ssh -o BatchMode=yes root@{{ proxmox_api_host }} bash -s <<'SH'
    conf=/etc/pve/lxc/{{ samba_vmid }}.conf
    changed=0
    {% for mount in samba_mounts %}
    want='{{ mount.line }}'
    if ! grep -qxF "$want" "$conf"; then
      pct set {{ samba_vmid }} -mp{{ mount.index }} {{ mount.spec }}
      changed=1
    fi
    {% endfor %}
    if [ "$changed" = 1 ]; then echo changed; else echo ok; fi
    SH
  register: mount_result
  changed_when: mount_result.stdout == "changed"

- name: Poser l'idmap de utilisateur et perso
  ansible.builtin.shell: |
    ssh -o BatchMode=yes root@{{ proxmox_api_host }} python3 - <<'PY'
    from pathlib import Path
    p = Path("/etc/pve/lxc/{{ samba_vmid }}.conf")
    idmap = [
    {% for line in samba_idmap %}
        "{{ line }}",
    {% endfor %}
    ]
    text = p.read_text()
    kept = [line for line in text.splitlines() if not line.startswith("lxc.idmap:")]
    new = "\n".join(kept + idmap) + "\n"
    if text == new:
        print("ok")
    else:
        p.write_text(new)
        print("changed")
    PY
  register: idmap_result
  changed_when: idmap_result.stdout == "changed"

- name: Vérifier les montages en lecture seule
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - root@{{ proxmox_api_host }}
      - pct
      - config
      - "{{ samba_vmid }}"
  register: ct_config
  changed_when: false
  failed_when: samba_mounts | map(attribute='line') | reject('in', ct_config.stdout) | list | length > 0

- name: Démarrer le CT d'essai
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: root@pam
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: false
    vmid: "{{ samba_vmid }}"
    state: started
  no_log: true
